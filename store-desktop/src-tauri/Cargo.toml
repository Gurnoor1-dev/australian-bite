[package]
name = "australian-bite-store-pos"
version = "0.1.0"
description = "Australian Bite Store POS"
authors = ["Australian Bite"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winspool", "minwindef", "winnt"] }
ureq = { version = "2.12", features = ["json"] }
semver = "1"
sha2 = "0.10"