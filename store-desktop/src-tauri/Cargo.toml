[package]
name = "australian-bite-store-pos"
version = "0.1.0"
description = "Australian Bite Store POS"
authors = ["Australian Bite"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winspool", "minwindef", "winnt"] }