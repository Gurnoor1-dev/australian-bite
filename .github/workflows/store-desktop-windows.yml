name: Australian Bite POS · Desktop and Android

on:
  push:
    branches:
      - feature/store-desktop-pos
    tags:
      - "store-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: australian-bite-pos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate POS frontend
    if: startsWith(github.ref, 'refs/heads/feature/store-desktop-pos') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: store-desktop
        run: npm install
      - name: Build frontend
        working-directory: store-desktop
        run: npm run web

  windows-release:
    name: Build Windows EXE
    if: startsWith(github.ref, 'refs/tags/store-v') && endsWith(github.ref, '.0.0')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set release version
        run: node scripts/set-pos-version.mjs "${{ github.ref_name }}"
      - name: Install dependencies
        working-directory: store-desktop
        run: npm install
      - name: Build Windows installer
        working-directory: store-desktop
        run: npm run build
      - name: Create installer checksum
        shell: pwsh
        run: |
          $installers = Get-ChildItem "store-desktop/src-tauri/target/release/bundle/nsis" -Filter "*setup.exe"
          if (-not $installers) { throw "The NSIS setup installer was not generated." }
          foreach ($installer in $installers) {
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -NoNewline "$($installer.FullName).sha256" "$hash  $($installer.Name)"
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: australian-bite-pos-windows
          path: |
            store-desktop/src-tauri/target/release/bundle/nsis/*setup.exe
            store-desktop/src-tauri/target/release/bundle/nsis/*setup.exe.sha256
          if-no-files-found: error
          retention-days: 3

  android-release:
    name: Build signed Android APK
    if: startsWith(github.ref, 'refs/tags/store-v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install Rust and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Set release version
        run: node scripts/set-pos-version.mjs "${{ github.ref_name }}"
      - name: Install dependencies
        working-directory: store-desktop
        run: npm install
      - name: Generate platform icons
        working-directory: store-desktop
        run: npm run icons
      - name: Initialize Tauri Android project
        working-directory: store-desktop
        run: npx tauri android init --ci
      - name: Configure persistent Android signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEY_BASE64" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::Add ANDROID_KEY_BASE64, ANDROID_KEY_PASSWORD, and ANDROID_KEY_ALIAS repository secrets before publishing Android releases."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ab-pos-signing"
          echo "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/ab-pos-signing/australian-bite-pos.jks"
          {
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/ab-pos-signing/australian-bite-pos.jks"
          } > store-desktop/src-tauri/gen/android/keystore.properties
      - name: Apply Android signing configuration
        run: node scripts/configure-android-signing.mjs
      - name: Build Android APK
        working-directory: store-desktop
        run: npx tauri android build --apk --ci
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: australian-bite-pos-android
          path: store-desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 3

  publish-major-release:
    name: Publish major release installers
    if: startsWith(github.ref, 'refs/tags/store-v')
    needs:
      - windows-release
      - android-release
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: australian-bite-pos-windows
          path: release-assets
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: australian-bite-pos-android
          path: release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.sha256
            release-assets/**/*.apk
